name: Linux strict and instrumented validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, asan, tsan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential g++-12 cmake libsqlite3-dev libspdlog-dev nlohmann-json3-dev libgtest-dev python3 pkg-config
      - name: Strict build and real instrumented execution
        env:
          CXX: ${{ matrix.mode == 'tsan' && 'g++-12' || 'g++' }}
        run: |
          python3 scripts/run_validation.py --mode '${{ matrix.mode }}' \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/build-${{ matrix.mode }}" --jobs 2 \
            ${{ matrix.mode == 'tsan' && '--fixed-address-layout' || '' }}
      - name: M10 repeated acceptance
        if: matrix.mode == 'debug'
        run: ctest --test-dir "$RUNNER_TEMP/build-debug" -L m10 --output-on-failure --repeat until-fail:20
      - name: Preserve evidence even on unsupported sanitizer runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: validation-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/build-${{ matrix.mode }}/*.log
            ${{ runner.temp }}/build-${{ matrix.mode }}/validation.json
            ${{ runner.temp }}/build-${{ matrix.mode }}/Testing/Temporary/*.log
            ${{ runner.temp }}/build-${{ matrix.mode }}/tsan-applications-*/**
